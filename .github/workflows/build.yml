name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project and build
        run: |
          {
            set -e
            flutter create --org com.example --project-name speed_map --platforms android app
            cp -r lib assets pubspec.yaml app/
            cd app
            M=android/app/src/main/AndroidManifest.xml
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <application|' $M
            sed -i 's|android:label="speed_map"|android:label="Speed Map"|' $M
            flutter pub get
            dart run flutter_launcher_icons
            dart run flutter_native_splash:create
            flutter build apk --release
          } > "$GITHUB_WORKSPACE/build.log" 2>&1 || {
            echo "::error title=Build failed::$(tail -n 45 "$GITHUB_WORKSPACE/build.log" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: speed_map-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk speed_map.apk
          gh release create "v1.1.${{ github.run_number }}" speed_map.apk --repo "${{ github.repository }}" --title "Speed Map v1.1.${{ github.run_number }}" --notes "New design, custom marker, launcher icon and splash screen."
