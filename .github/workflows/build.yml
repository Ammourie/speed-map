name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create project and build
        run: |
          flutter create --org com.example --project-name speed_map app
          mkdir -p src
          mkdir -p src/.
          cat > src/pubspec.yaml <<'EOF_FILE'
          name: speed_map
          description: Live map with driving speed updated every second.
          publish_to: none
          version: 1.0.0+1

          environment:
            sdk: ">=3.3.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            flutter_localizations:
              sdk: flutter
            intl: any
            flutter_map: ^7.0.2
            latlong2: ^0.9.1
            geolocator: ^13.0.2

          dev_dependencies:
            flutter_lints: ^4.0.0

          flutter:
            uses-material-design: true

          flutter_intl:
            enabled: true
          EOF_FILE
          mkdir -p src/lib
          cat > src/lib/main.dart <<'EOF_FILE'
          import 'dart:async';
          import 'dart:math' as math;

          import 'package:flutter/material.dart';
          import 'package:flutter_localizations/flutter_localizations.dart';
          import 'package:flutter_map/flutter_map.dart';
          import 'package:geolocator/geolocator.dart';
          import 'package:latlong2/latlong.dart';

          import 'generated/l10n.dart';

          void main() => runApp(const SpeedMapApp());

          class SpeedMapApp extends StatelessWidget {
            const SpeedMapApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                onGenerateTitle: (_) => S.current.appTitle,
                localizationsDelegates: const [
                  S.delegate,
                  GlobalMaterialLocalizations.delegate,
                  GlobalWidgetsLocalizations.delegate,
                  GlobalCupertinoLocalizations.delegate,
                ],
                supportedLocales: S.delegate.supportedLocales,
                theme: ThemeData(colorSchemeSeed: Colors.blue, useMaterial3: true),
                home: const SpeedMapPage(),
              );
            }
          }

          class SpeedMapPage extends StatefulWidget {
            const SpeedMapPage({super.key});

            @override
            State<SpeedMapPage> createState() => _SpeedMapPageState();
          }

          class _SpeedMapPageState extends State<SpeedMapPage> {
            final MapController _map = MapController();
            StreamSubscription<Position>? _sub;
            bool _mapReady = false;
            LatLng? _pos;
            double _speedKmh = 0;
            double _heading = 0;
            String? _error;

            @override
            void initState() {
              super.initState();
              _start();
            }

            Future<void> _start() async {
              await _sub?.cancel();
              setState(() => _error = null);

              if (!await Geolocator.isLocationServiceEnabled()) {
                setState(() => _error = S.current.locationServicesDisabled);
                return;
              }
              var perm = await Geolocator.checkPermission();
              if (perm == LocationPermission.denied) {
                perm = await Geolocator.requestPermission();
              }
              if (perm == LocationPermission.denied) {
                setState(() => _error = S.current.permissionDenied);
                return;
              }
              if (perm == LocationPermission.deniedForever) {
                setState(() => _error = S.current.permissionDeniedForever);
                return;
              }

              _sub = Geolocator.getPositionStream(
                locationSettings: AndroidSettings(
                  accuracy: LocationAccuracy.bestForNavigation,
                  distanceFilter: 0,
                  intervalDuration: const Duration(seconds: 1),
                ),
              ).listen(_onPosition, onError: (e) {
                if (mounted) setState(() => _error = e.toString());
              });
            }

            void _onPosition(Position p) {
              final ll = LatLng(p.latitude, p.longitude);
              setState(() {
                _pos = ll;
                _speedKmh = math.max(0, p.speed) * 3.6; // m/s -> km/h
                if (p.speed > 0.5) _heading = p.heading;
              });
              if (_mapReady) {
                _map.move(ll, math.max(_map.camera.zoom, 16));
              }
            }

            @override
            void dispose() {
              _sub?.cancel();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final pos = _pos;
              return Scaffold(
                body: Stack(
                  children: [
                    FlutterMap(
                      mapController: _map,
                      options: MapOptions(
                        initialCenter: pos ?? const LatLng(33.5138, 36.2765),
                        initialZoom: 16,
                        onMapReady: () {
                          _mapReady = true;
                          if (_pos != null) _map.move(_pos!, 16);
                        },
                      ),
                      children: [
                        TileLayer(
                          urlTemplate: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
                          userAgentPackageName: 'com.example.speed_map',
                        ),
                        if (pos != null)
                          MarkerLayer(markers: [
                            Marker(
                              point: pos,
                              width: 48,
                              height: 48,
                              child: Transform.rotate(
                                angle: _heading * math.pi / 180,
                                child: const Icon(Icons.navigation,
                                    size: 44, color: Colors.blue),
                              ),
                            ),
                          ]),
                      ],
                    ),
                    Positioned(
                      left: 16,
                      right: 16,
                      bottom: 32,
                      child: SafeArea(child: _speedCard(context)),
                    ),
                  ],
                ),
              );
            }

            Widget _speedCard(BuildContext context) {
              final t = Theme.of(context).textTheme;
              return Card(
                elevation: 6,
                child: Padding(
                  padding: const EdgeInsets.symmetric(vertical: 16, horizontal: 24),
                  child: _error != null
                      ? Column(mainAxisSize: MainAxisSize.min, children: [
                          Text(_error!, textAlign: TextAlign.center),
                          const SizedBox(height: 8),
                          FilledButton(onPressed: _start, child: Text(S.current.retry)),
                        ])
                      : _pos == null
                          ? Row(mainAxisSize: MainAxisSize.min, children: [
                              const SizedBox(
                                  width: 20,
                                  height: 20,
                                  child: CircularProgressIndicator(strokeWidth: 2)),
                              const SizedBox(width: 12),
                              Text(S.current.waitingForGps),
                            ])
                          : Row(
                              mainAxisAlignment: MainAxisAlignment.center,
                              crossAxisAlignment: CrossAxisAlignment.baseline,
                              textBaseline: TextBaseline.alphabetic,
                              children: [
                                Text(_speedKmh.round().toString(),
                                    style: t.displayLarge
                                        ?.copyWith(fontWeight: FontWeight.bold)),
                                const SizedBox(width: 8),
                                Text(S.current.speedUnit, style: t.titleLarge),
                              ],
                            ),
                ),
              );
            }
          }
          EOF_FILE
          mkdir -p src/lib/generated
          cat > src/lib/generated/l10n.dart <<'EOF_FILE'
          // GENERATED-STYLE FILE (matches Flutter Intl / intl_utils output).
          // Regenerate with the Flutter Intl plugin after editing lib/l10n/*.arb.
          // ignore_for_file: non_constant_identifier_names, lines_longer_than_80_chars

          import 'package:flutter/material.dart';
          import 'package:intl/intl.dart';

          class S {
            S();

            static S? _current;

            static S get current {
              assert(_current != null,
                  'No instance of S was loaded. Try to initialize the S delegate before accessing S.current.');
              return _current!;
            }

            static const AppLocalizationDelegate delegate = AppLocalizationDelegate();

            static Future<S> load(Locale locale) {
              final name = (locale.countryCode?.isEmpty ?? false)
                  ? locale.languageCode
                  : locale.toString();
              final localeName = Intl.canonicalizedLocale(name);
              return Future.value(S()).then((instance) {
                Intl.defaultLocale = localeName;
                S._current = instance;
                return instance;
              });
            }

            static S of(BuildContext context) => Localizations.of<S>(context, S)!;

            String get appTitle => Intl.message('Speed Map', name: 'appTitle', desc: '', args: []);
            String get speedUnit => Intl.message('km/h', name: 'speedUnit', desc: '', args: []);
            String get waitingForGps => Intl.message('Waiting for GPS signal…', name: 'waitingForGps', desc: '', args: []);
            String get locationServicesDisabled => Intl.message('Location services are disabled.', name: 'locationServicesDisabled', desc: '', args: []);
            String get permissionDenied => Intl.message('Location permission denied.', name: 'permissionDenied', desc: '', args: []);
            String get permissionDeniedForever => Intl.message('Location permission permanently denied. Enable it in system settings.', name: 'permissionDeniedForever', desc: '', args: []);
            String get retry => Intl.message('Retry', name: 'retry', desc: '', args: []);
          }

          class AppLocalizationDelegate extends LocalizationsDelegate<S> {
            const AppLocalizationDelegate();

            List<Locale> get supportedLocales => const <Locale>[Locale.fromSubtags(languageCode: 'en')];

            @override
            bool isSupported(Locale locale) => supportedLocales.any((l) => l.languageCode == locale.languageCode);

            @override
            Future<S> load(Locale locale) => S.load(locale);

            @override
            bool shouldReload(AppLocalizationDelegate old) => false;
          }
          EOF_FILE
          mkdir -p src/lib/l10n
          cat > src/lib/l10n/intl_en.arb <<'EOF_FILE'
          {
            "@@locale": "en",
            "appTitle": "Speed Map",
            "speedUnit": "km/h",
            "waitingForGps": "Waiting for GPS signal…",
            "locationServicesDisabled": "Location services are disabled.",
            "permissionDenied": "Location permission denied.",
            "permissionDeniedForever": "Location permission permanently denied. Enable it in system settings.",
            "retry": "Retry"
          }
          EOF_FILE
          cp -r src/lib src/pubspec.yaml app/
          cd app
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: speed_map-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk speed_map.apk
          gh release create "v1.0.${{ github.run_number }}" speed_map.apk --repo "${{ github.repository }}" --title "Speed Map v1.0.${{ github.run_number }}" --notes "Release APK"
